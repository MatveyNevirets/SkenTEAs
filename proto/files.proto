syntax="proto3";

service FilesRpc {
   rpc PutFile(FileDto) returns (ResponseDto);
   rpc DeleteFile(FileDto) returns (ResponseDto);
   rpc FetchFile(FileDto) returns (stream FileDto);
}

message FileDto {
    string bucket = 1;
    string name = 2;
    bytes data = 3;
    string tag = 4;
}

message RequestDto {}

message ResponseDto {
    string message = 1;
}
